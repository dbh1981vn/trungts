plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
 namespace 'com.tsstudio.android'
 compileSdk 35
 defaultConfig {
  applicationId 'com.tsstudio.android'
  minSdk 24
  targetSdk 34
  versionCode 20000
  versionName '2.0-android'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy { defaultConfig { version='3.11'; pip { install 'lz4'; install 'requests==2.32.3'; install 'cryptography' } } }
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'androidx.documentfile:documentfile:1.0.1'
}
