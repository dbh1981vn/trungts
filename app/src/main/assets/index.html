<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'"><title>TS Studio</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">TS</span><div><b>TS Studio</b><small>ANDROID · 2.0</small></div></div><button id="settingsButton" class="icon" aria-label="Settings">⚙</button></header><main>
<section class="connection"><div class="connectionInfo"><div class="connectionStatus"><span id="statusDot" class="dot"></span><b id="status">Not connected</b></div><div id="connectionStats" class="connectionStats" hidden><span><small id="cityIdLabel">City ID</small><b id="cityId">—</b></span><span><small id="cityFverLabel">FVer</small><b id="cityFver">—</b></span><span><small id="cityLevelLabel">Level</small><b id="cityLevel">—</b></span></div></div><button id="connectButton" class="primary">Connect</button></section>
<div id="workspace" hidden><nav id="tabs"></nav><div class="sectionTitle"><h2 id="tabTitle">Profile Statics</h2><span id="dirty"></span></div><section id="content"></section><div class="commitbar"><button id="undoButton">↶ Undo</button><button id="applyButton" class="primary">Apply · Write to Game</button></div></div>
<section class="logs"><details open><summary><b id="logTitle">Activity Log</b><span class="live">● LIVE</span></summary><div id="logLines"></div><div class="logActions"><button id="exportLog">Export log</button><button id="clearLog">Clear</button></div></details></section><footer>TS STUDIO • BUILT FOR YOUR CITY</footer></main>
<div id="overlay" hidden><section class="modal"><div class="modalHead"><div><small>WORKSPACE EDITOR</small><h2 id="modalTitle"></h2></div><button id="closeModal" class="icon">×</button></div><div id="modalBody"></div><div class="modalFooter"><span id="modalHint"></span><div><button id="cancelModal">Cancel</button><button id="saveModal" class="primary">Save changes</button></div></div></section></div>
<div id="busy" hidden><span class="spinner"></span><span id="busyText">Working…</span><button id="cancelTask">Stop</button></div><div id="toast" hidden role="status"></div><script src="translations.js"></script><script src="app.js"></script></body></html>
